# Unity 빌드 CI/CD — .github/workflows/unity-ci.yml 로 넣는다
# CI : test_build 로 가는 PR 에서만 Android 빌드 검사 (develop · 기능 브랜치에서는 돌지 않는다)
#      test_build 에 머지된 뒤 한 번 더 돌아 Library 캐시를 test_build 에 저장한다 → 다음 PR 빌드가 빨라진다
# CD : v* 태그 push (예: v0.2.0) → 서명된 AAB 빌드 → 아티팩트 업로드 (+ 플레이 콘솔 업로드는 아래 주석 참고)
# PC : release/* push · v* 태그 · 수동 실행 → Windows 64비트 빌드 (Mono) → zip 아티팩트. release/* push 에는 Android 를 돌리지 않는다
# 배포 : v* 태그 빌드가 끝나면 GitHub Release 를 만든다 — PC zip + 설치용 APK(AAB 를 같은 키로 변환). 0.x 는 Pre-release
#        이미 있는 태그를 다시 올릴 때: 수동 실행에 release_tag 를 넣으면 빌드 없이 그 태그 빌드의 아티팩트로 Release 만 만든다
name: Unity 빌드

on:
  pull_request:
    branches: [test_build]
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches:
      - test_build   # 캐시용. 머지 뒤 빌드가 필요 없으면 이 줄을 지운다
      - "release/*"  # PC 빌드 (windows job)
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드 없이 Release 만 만들 태그 (예: v0.1.3). 비우면 평소 빌드"
        required: false
        default: ""

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: MuffinProject

jobs:
  # 테스트 asmdef(EditMode/PlayMode) 를 만들면 주석을 풀어 쓴다
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/cache@v4
  #       with:
  #         path: MuffinProject/Library
  #         key: Library-test-${{ hashFiles('MuffinProject/Assets/**', 'MuffinProject/Packages/**', 'MuffinProject/ProjectSettings/**') }}
  #         restore-keys: Library-test-
  #     - uses: game-ci/unity-test-runner@v4
  #       env:
  #         UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  #         UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  #         UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  #       with:
  #         projectPath: MuffinProject
  #         testMode: editmode
  #         githubToken: ${{ secrets.GITHUB_TOKEN }}

  android:
    # release/* push 는 PC 빌드만 — Android 확인 빌드는 git-workflow 표대로 CI 를 고칠 때 붙인다
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) && !inputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      # Android 에디터 이미지가 커서 기본 러너 디스크가 모자란다
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: MuffinProject/Library
          key: Library-android-${{ hashFiles('MuffinProject/Assets/**', 'MuffinProject/Packages/**', 'MuffinProject/ProjectSettings/**') }}
          restore-keys: Library-android-

      - name: 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: MuffinProject
          targetPlatform: Android
          # 태그 빌드만 스토어용 AAB + 서명, 나머지는 빠른 APK
          androidExportType: ${{ startsWith(github.ref, 'refs/tags/v') && 'androidAppBundle' || 'androidPackage' }}
          # 서명 값은 태그 빌드에만 넘긴다 — 이름만 넘어가도 Custom Keystore 가 켜져서 파일 없음 에러가 난다
          androidKeystoreName: ${{ startsWith(github.ref, 'refs/tags/v') && 'chapchu.keystore' || '' }}
          androidKeystoreBase64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          androidKeystorePass: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASS || '' }}
          androidKeyaliasName: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYALIAS_NAME || '' }}
          androidKeyaliasPass: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYALIAS_PASS || '' }}
          # 버전은 Player Settings 값 그대로 쓴다 (docs/versioning.md 규칙 유지)
          versioning: None

      - uses: actions/upload-artifact@v4
        with:
          # PR 이면 ref_name 이 "160/merge" 라 / 가 들어가서 쓸 수 없다 → pr160 으로
          name: android-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.run_number }}
          path: build/Android
          retention-days: 14

      # 플레이 콘솔 자동 업로드 — 첫 AAB 는 콘솔에서 손으로 올려야 하고,
      # 패키지 ID 를 정한 뒤 서비스 계정 JSON 을 시크릿에 넣으면 주석을 푼다
      # - if: startsWith(github.ref, 'refs/tags/v')
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.example.chapchu   # ← 확정된 패키지 ID
      #     releaseFiles: build/Android/*.aab
      #     track: internal
      #     status: draft

  # PC (Windows 64비트) — Ubuntu 러너에서 Mono 로 빌드한다 (IL2CPP 는 Windows 러너가 있어야 한다)
  windows:
    if: ${{ github.event_name != 'pull_request' && !inputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: MuffinProject/Library
          key: Library-windows-${{ hashFiles('MuffinProject/Assets/**', 'MuffinProject/Packages/**', 'MuffinProject/ProjectSettings/**') }}
          restore-keys: Library-windows-

      - name: 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: MuffinProject
          targetPlatform: StandaloneWindows64
          buildName: ChapChu
          # 버전은 Player Settings 값 그대로 쓴다 (docs/versioning.md 규칙 유지)
          versioning: None

      - uses: actions/upload-artifact@v4
        with:
          # ref_name 에 / 가 들어가면(release/0.1.0) 아티팩트 이름으로 못 쓴다 → 실행 번호만
          name: chapchu-windows-${{ github.run_number }}
          path: build/StandaloneWindows64
          retention-days: 14

  # 배포 페이지 — v* 태그 빌드가 끝나면 (또는 수동 실행 release_tag) GitHub Release 를 만든다
  release:
    needs: [android, windows]
    # Android 가 실패해도 PC 만으로 올린다. 이미 있으면 파일만 바꿔 올린다
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success') || inputs.release_tag) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 태그 · 빌드 실행 찾기
        id: meta
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VER="${TAG#v}"
          if [ -n "${{ inputs.release_tag }}" ]; then
            RUN_ID=$(gh run list --workflow unity-ci.yml --branch "$TAG" --status success --limit 1 --json databaseId -q '.[0].databaseId')
            [ -n "$RUN_ID" ] || { echo "::error::$TAG 의 성공한 빌드가 없다"; exit 1; }
          else
            RUN_ID="${{ github.run_id }}"
          fi
          # 빌드 이름 = 태그 메시지 (docs/versioning.md 「태그」)
          OBJ=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" -q '.object.type + " " + .object.sha')
          if [ "${OBJ%% *}" = "tag" ]; then
            NAME=$(gh api "repos/$GH_REPO/git/tags/${OBJ#* }" -q '.message' | head -n1)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "name=${NAME:-$VER}" >> "$GITHUB_OUTPUT"

      - name: 아티팩트 받기
        run: |
          gh run download "${{ steps.meta.outputs.run_id }}" -p 'chapchu-windows-*' -D pc
          gh run download "${{ steps.meta.outputs.run_id }}" -p 'android-*' -D android || echo "Android 아티팩트 없음 — PC 만 올린다"

      - name: PC zip
        run: |
          DIR=$(dirname "$(find pc -name ChapChu.exe | head -n1)")
          rm -rf "$DIR"/*_BurstDebugInformation_DoNotShip
          mkdir -p out
          (cd "$DIR" && zip -qr "$GITHUB_WORKSPACE/out/ChapChu-${{ steps.meta.outputs.ver }}-windows.zip" .)

      - name: 설치용 APK (AAB → universal APK, 같은 서명 키)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          KEY_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          AAB=$(find android -name '*.aab' 2>/dev/null | head -n1)
          [ -n "$AAB" ] || { echo "AAB 없음 — APK 건너뜀"; exit 0; }
          gh release download -R google/bundletool -p 'bundletool-all-*.jar' -O bundletool.jar
          echo "$KS_B64" | base64 -d > release.keystore
          java -jar bundletool.jar build-apks --bundle="$AAB" --output=app.apks --mode=universal \
            --ks=release.keystore --ks-pass="pass:$KS_PASS" --ks-key-alias="$KEY_ALIAS" --key-pass="pass:$KEY_PASS"
          unzip -p app.apks universal.apk > "out/ChapChu-${{ steps.meta.outputs.ver }}-android.apk"
          rm -f release.keystore

      - name: Release 만들기
        run: |
          TAG="${{ steps.meta.outputs.tag }}"; VER="${{ steps.meta.outputs.ver }}"
          PRE=""; case "$VER" in 0.*) PRE="--prerelease";; esac
          APK_LINE=""; [ -f "out/ChapChu-$VER-android.apk" ] && APK_LINE="- Android: \`ChapChu-$VER-android.apk\` 을 휴대폰에서 받아 설치 (출처를 알 수 없는 앱 허용)"
          cat > notes.md <<NOTES
          ## 받기 · 실행
          - PC: \`ChapChu-$VER-windows.zip\` 을 풀고 \`ChapChu.exe\` 실행
          $APK_LINE

          ## 참고
          - 같은 버전($VER)끼리만 매칭된다
          - 빌드: 태그 \`$TAG\` 커밋 (CI Unity 빌드 run ${{ steps.meta.outputs.run_id }})
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --verify-tag --title "${{ steps.meta.outputs.name }}" $PRE --notes-file notes.md --generate-notes
          fi
