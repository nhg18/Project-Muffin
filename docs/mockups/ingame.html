<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--
  인게임 화면 시안 — 아티팩트 「찹츄 인게임 UI」 https://claude.ai/artifact/86ZUodZbY9ghjhB24j9iP8
  게시본 1793932433-287b (2026-11-06) 사본. 기준 문서: docs/systems/10-ui.md 2-1 (CSS px × 2 = 캔버스 px).
  그림은 파일 안에 data URI 로 들어 있다. 왼쪽 위 「시안 조작」은 리뷰용이라 게임에 넣지 않는다.
-->
<title>찹츄 인게임 UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 단일 룩: 하늘색 방 + 버터색 펠트 + 분홍 테두리, 남색 굵은 외곽선 스티커 UI (프로토타입과 같은 팔레트) */
:root{
  --ink:#2b2856; --muted:#6a6794; --line:#e5e1f5; --panel:#fff; --panel2:#f4f1ff;
  --sky1:#bfe6ff; --sky2:#fff1f7; --felt:#ffe594; --felt2:#ffcf5e; --rim:#ff8db4; --rim2:#f0679a;
  --accent:#ff5c8a; --accent-ink:#c2255c; --accent2:#ffd23f; --act:#0b7ccc; --ctr:#4f8a1f; --trp:#f64612; --trp-ink:#c4380c;
  --hp:#ff4f7b; --ok:#2fbf6a; --warn:#ff9f1a; --off:#a9a6c4;
  --f-d:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-b:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky2);color:var(--ink);font-family:var(--f-b);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;
  background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.75) 0 60px,transparent 61px),radial-gradient(circle at 88% 12%,rgba(255,255,255,.6) 0 80px,transparent 81px),
    radial-gradient(rgba(255,255,255,.55) 2px,transparent 2.5px) 0 0/34px 34px,linear-gradient(180deg,var(--sky1),var(--sky2))}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#center{position:absolute;width:960px;height:540px}
#probe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.abs{position:absolute}

/* 테이블: 눕힌 판 */
.persp{position:absolute;left:0;top:0;width:960px;height:540px;z-index:3;perspective:900px;perspective-origin:480px 180px;pointer-events:none}
.plane{position:absolute;inset:0;transform-origin:480px 310px;transform:rotateX(40deg)}
.plane .deck{pointer-events:auto}
.table{position:absolute;border-radius:50%;z-index:3;pointer-events:none;
  background:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2.5px) 0 0/22px 22px,radial-gradient(60% 60% at 50% 45%,var(--felt),var(--felt2) 96%);
  box-shadow:0 0 0 4px var(--ink),0 0 0 14px var(--rim),0 0 0 18px var(--ink),0 12px 0 18px var(--rim2),0 14px 0 21px var(--ink),0 34px 40px 20px rgba(43,40,86,.22)}
.table .dash{position:absolute;inset:7%;border-radius:50%;border:3px dashed rgba(255,255,255,.7)}
.table .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-d);font-size:92px;color:rgba(240,103,154,.13);white-space:nowrap}
.deck{position:absolute;z-index:4;width:66px;height:98px;padding:0;border:0;border-radius:6px;background:#0b8fe6;cursor:default;
  box-shadow:0 0 0 2px var(--ink),0 3px 0 #fff,0 5px 0 var(--ink),0 8px 0 #fff,0 10px 0 var(--ink),0 16px 16px rgba(43,40,86,.3)}
.deck img{width:100%;height:100%;object-fit:cover;display:block;border-radius:6px}
.deck.can{cursor:pointer;animation:deckpulse 1.1s ease-in-out infinite}
@keyframes deckpulse{50%{box-shadow:0 0 0 2px var(--ink),0 3px 0 #fff,0 5px 0 var(--ink),0 8px 0 #fff,0 10px 0 var(--ink),0 0 0 7px var(--accent2),0 0 28px 10px rgba(255,210,63,.9)}}
.pilelab{position:absolute;z-index:4;transform:translateX(-50%);padding:1px 9px;border-radius:999px;background:rgba(255,255,255,.85);font-size:12px;font-weight:700;white-space:nowrap}
.pilelab b{font-family:var(--f-d);font-weight:400;font-size:14px;font-variant-numeric:tabular-nums}
.hint{position:absolute;z-index:6;transform:translateX(-50%);padding:3px 10px;border-radius:999px;background:var(--accent2);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--f-d);font-size:13px;white-space:nowrap;pointer-events:none}
.blank{position:absolute;z-index:4;width:66px;height:98px;border-radius:6px;background:#fff;box-shadow:0 0 0 2px var(--ink)}
.table{transition:box-shadow .15s}
.table.hot{box-shadow:0 0 0 4px var(--ink),0 0 0 14px var(--accent2),0 0 0 18px var(--ink),0 12px 0 18px var(--rim2),0 14px 0 21px var(--ink),0 0 46px 26px rgba(255,210,63,.75)}
.table.hot .dash{border-color:#fff;border-style:solid}
.slot{position:absolute;z-index:4;width:20px;height:28px;border-radius:4px;overflow:hidden;border:2px dashed rgba(43,40,86,.3);background:rgba(255,255,255,.35)}
.slot.me{width:26px;height:36px;border-radius:5px}
.slot.set{border:2px solid var(--ink)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
/* 좌우 플레이어: 그 사람 쪽을 보게 가로로 눕힌 카드 */
.slot.side{width:28px;height:20px}
.slot.side img{position:absolute;left:4px;top:-4px;width:16px;height:24px;rotate:90deg}
.slot.side.r img{rotate:-90deg}

/* 캐릭터 */
.char{position:absolute;z-index:2;transform-origin:50% 100%;transition:scale .18s ease-out,filter .25s;filter:drop-shadow(0 6px 0 rgba(43,40,86,.16))}
.char.turn{scale:1.06;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 0 10px var(--pc)) drop-shadow(0 0 4px var(--pc))}
.char.hit{filter:drop-shadow(3px 0 0 var(--trp)) drop-shadow(-3px 0 0 var(--trp)) drop-shadow(0 3px 0 var(--trp)) drop-shadow(0 -3px 0 var(--trp)) drop-shadow(0 0 14px rgba(246,70,18,.7))}
.char.pick{z-index:31;cursor:pointer;animation:pickblink .6s ease-in-out infinite alternate}
@keyframes pickblink{from{filter:drop-shadow(2.5px 0 0 var(--trp)) drop-shadow(-2.5px 0 0 var(--trp)) drop-shadow(0 2.5px 0 var(--trp)) drop-shadow(0 -2.5px 0 var(--trp)) drop-shadow(0 0 6px rgba(246,70,18,.5))}
  to{filter:drop-shadow(4px 0 0 var(--trp)) drop-shadow(-4px 0 0 var(--trp)) drop-shadow(0 4px 0 var(--trp)) drop-shadow(0 -4px 0 var(--trp)) drop-shadow(0 0 18px rgba(246,70,18,.85))}}
.char.pick.aim{scale:1.06}
.char.pending{animation:pend 1s ease-in-out infinite}
@keyframes pend{50%{filter:brightness(.55) saturate(.6)}}
.char.dead{filter:grayscale(1) opacity(.5)}
.shake{animation:shake .42s}
@keyframes shake{20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:3px 0}}
.fback{position:absolute;z-index:5;width:18px;height:27px;border-radius:3px;box-shadow:0 0 0 1.5px var(--ink);transform-origin:50% 160%;object-fit:cover;pointer-events:none}

/* 상대 이름표 */
.plate{position:absolute;z-index:6;width:156px;padding:6px 8px 7px;background:var(--panel);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:6px;transition:box-shadow .2s}
.plate.turn{box-shadow:0 4px 0 var(--ink),0 0 0 4px var(--pc),0 0 18px 4px var(--pc)}
.plate.pick{z-index:32;cursor:pointer;box-shadow:0 4px 0 var(--ink),0 0 0 4px var(--trp),0 0 18px 4px rgba(246,70,18,.6)}
.plate.dead{opacity:.6;filter:grayscale(1)}
.row{display:flex;align-items:center;gap:5px}
.npill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--pc);border:2px solid var(--ink);font-family:var(--f-d);font-size:15px;line-height:1;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap}
.hbox{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 6px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-family:var(--f-d);font-size:14px;line-height:1;font-variant-numeric:tabular-nums}
.hbox.full{background:#fff1e0;color:#b33f00}
.hbox svg{width:9px;height:12px}
.chapb{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);border:2px solid var(--ink);color:#fff;font-family:var(--f-d);font-size:13px;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;white-space:nowrap}
.hpbar{flex:1;height:10px;border:2px solid var(--ink);border-radius:8px;background:#ffe3ec;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff7aa0,var(--hp))}
.hpbar i.low{background:var(--warn)}
.hpn{font-family:var(--f-d);font-size:15px;line-height:1;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.tbadge{position:absolute;right:-9px;top:-12px;display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 6px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--f-d);font-size:14px;line-height:1;font-variant-numeric:tabular-nums}
.tbadge.low{background:var(--warn);color:var(--ink)}
.tbadge svg{width:12px;height:12px}
.tag{position:absolute;transform:translateX(-50%);z-index:7;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--f-d);font-size:14px;white-space:nowrap;pointer-events:none}
.tag.pend{background:var(--warn);color:var(--ink)} .tag.dead{background:#c9c6dd;color:var(--ink)}
.tag.pick{z-index:33;background:#fff;color:var(--trp-ink)}
.tag.aim{z-index:33;background:var(--trp);color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}

/* 위 막대 */
.room{position:absolute;z-index:25;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--ink);color:#fff;white-space:nowrap}
.room small{font-size:11px;font-weight:700;letter-spacing:.08em;color:#c9c6ff}
.room b{font-family:var(--f-d);font-weight:400;font-size:16px;letter-spacing:.06em}
.strip{position:absolute;z-index:25;transform:translateX(-50%);display:flex;align-items:center;gap:5px;height:40px;padding:0 14px 0 10px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.strip img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2.5px solid var(--pc);box-shadow:0 0 0 1.5px var(--ink);transition:width .2s,height .2s}
.strip img.cur{width:30px;height:30px;box-shadow:0 0 0 1.5px var(--ink),0 0 0 4px #fff,0 0 12px 4px var(--pc)}
.strip img.dead{filter:grayscale(1);opacity:.45}
.strip .lab{margin-left:5px;font-family:var(--f-d);font-size:15px}
.strip .dir{display:flex;transition:transform .3s}
.strip .dir.rev{transform:scaleX(-1)}
.tbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 12px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;box-shadow:0 3px 0 var(--ink);font-family:var(--f-d);font-size:15px}
.tbtn.icon{width:40px;padding:0;justify-content:center}
.tbtn[aria-pressed="true"],.tbtn[aria-expanded="true"]{background:var(--accent2)}
.tbtn:active,.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tbtn svg{width:17px;height:17px}

/* 나 */
.panel{position:absolute;z-index:9;width:250px;height:98px;padding:8px 10px;background:var(--panel);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:6px;transition:box-shadow .2s}
.panel.turn{box-shadow:0 5px 0 var(--ink),0 0 0 4px #2aa7ff,0 0 18px 4px rgba(42,167,255,.65)}
.panel .hpbar{height:12px;flex:none}
.panel .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.panel .big{font-family:var(--f-d);font-weight:400;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.panel .big.low{color:#d9480f}
.tchip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--accent);border:2px solid var(--ink);color:#fff;font-family:var(--f-d);font-size:14px;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;white-space:nowrap}
.panel .hn{font-family:var(--f-d);font-weight:400;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.panel .hn.full{color:#d9480f}
.chap{position:absolute;z-index:10;width:198px;height:80px;padding:0;border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:0 5px 0 #c9c6dd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:not-allowed;transition:background .2s,box-shadow .2s}
.chap .t{font-family:var(--f-d);font-size:32px;line-height:1;color:var(--off)}
.chap .s{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:#efedf8;color:var(--muted);font-variant-numeric:tabular-nums}
.chap.ready{cursor:pointer;background:var(--accent);box-shadow:0 5px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px var(--accent2),0 0 30px 10px rgba(255,210,63,.8);animation:chapbob 1.2s ease-in-out infinite}
.chap.ready .t,.chap.done .t{font-size:34px;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
.chap.ready .s,.chap.done .s{background:#fff;color:var(--accent-ink)}
.chap.ready:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px var(--accent2)}
.chap.done{cursor:default;background:var(--accent);box-shadow:0 5px 0 var(--ink)}
@keyframes chapbob{50%{translate:0 -3px}}

/* 카드 (기준 110 × 164) */
.card{position:absolute;left:0;top:0;width:110px;height:164px;border-radius:11px;overflow:hidden;background:#fff;box-shadow:0 0 0 2px var(--ink),0 6px 12px rgba(43,40,86,.3);
  transition:transform .38s cubic-bezier(.25,.8,.3,1),box-shadow .2s,filter .2s,opacity .3s;will-change:transform;touch-action:none}
.card .tpl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.card .nm{position:absolute;left:23%;top:4.2%;width:72%;height:8.6%;display:flex;align-items:center;justify-content:center;font-family:var(--f-d);font-size:14.5px;line-height:1;color:#fff;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.card .nm.long{font-size:12px}
.card .art{position:absolute;left:5.6%;top:15.6%;width:88.8%;height:44.5%;overflow:hidden;background:#fff}
.card .art img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;pointer-events:none}
.card .tx{position:absolute;left:8%;top:63.5%;width:84%;height:31%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10.5px;line-height:1.35;font-weight:700;word-break:keep-all;color:var(--ink)}
.card{pointer-events:none}
/* 손패 안 움직임은 0.18초 (「손패 입력」), 뽑기 · 내기처럼 날아가는 이동은 0.38초 */
.card.hand{transition:transform .18s cubic-bezier(.25,.8,.3,1),box-shadow .2s,filter .2s,opacity .3s}
.card.hand.fly{transition-duration:.38s}
.card.hov{box-shadow:0 0 0 2px var(--ink),0 14px 30px rgba(43,40,86,.45)}
.card.armed{box-shadow:0 0 0 2px var(--ink),0 0 0 6px #fff,0 0 40px 10px var(--accent2)}
#zoom{position:absolute;inset:0;z-index:60;background:rgba(43,40,86,.55);pointer-events:none}
#zoom .card{transition:none}
.card.g-act{box-shadow:0 0 0 2px var(--ink),0 0 0 6px var(--accent2),0 0 22px 8px rgba(255,210,63,.75)}
.card.g-ctr{box-shadow:0 0 0 2px var(--ink),0 0 0 6px #5ef09c,0 0 22px 8px rgba(47,191,106,.75)}
.card.sel{box-shadow:0 0 0 2px var(--ink),0 0 0 6px var(--accent),0 0 26px 10px rgba(255,92,138,.7)}
.card.dim{filter:saturate(.45) brightness(.86)}
.card.drag{transition:box-shadow .15s;box-shadow:0 0 0 2px var(--ink),0 26px 50px rgba(43,40,86,.5)}
.card.gone{opacity:0}

/* 오버레이 · 안내 */
.dimmer{position:absolute;inset:0;z-index:30;background:rgba(43,40,86,.4)}
.pill{position:absolute;z-index:36;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink);white-space:nowrap}
.pill .q{font-size:14px;font-weight:700}
.pill .q em{font-style:normal;font-family:var(--f-d);font-size:18px}
.pill .cnt{font-family:var(--f-d);font-size:16px;color:var(--trp-ink);font-variant-numeric:tabular-nums}
.pbtn{height:34px;padding:0 15px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;box-shadow:0 3px 0 var(--ink);font-family:var(--f-d);font-size:15px}
.pbtn.main{background:var(--accent);color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
.rprompt{position:absolute;z-index:36;width:430px;padding:8px 10px 9px 14px;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:7px}
.rprompt .q{font-size:14px;font-weight:700;flex:1}
.rprompt .q em{font-style:normal;font-family:var(--f-d);font-size:18px;color:var(--accent-ink)}
.timer{flex:1;height:9px;border:2px solid var(--ink);border-radius:9px;background:#e9e6f7;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#a8f0c4)}
.cnt2{font-family:var(--f-d);font-size:15px;line-height:1;min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.chain{position:absolute;z-index:22;width:156px;padding:8px 10px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:6px}
.chain h3{margin:0;font-family:var(--f-d);font-weight:400;font-size:16px;line-height:1;color:var(--accent-ink)}
.chain .ln{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.chain .k{padding:1px 5px;border-radius:5px;color:#fff;font-size:11px;flex:none}
.chain .k.A{background:var(--act)} .chain .k.C{background:var(--ctr)} .chain .k.T{background:var(--trp)}
.chain .n{font-family:var(--f-d);font-weight:400;font-size:14px}
.chain .w{color:var(--muted);font-size:11.5px}
.chain p{margin:0;font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.3}
.owner{position:absolute;z-index:23;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:#fff;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--f-d);font-size:15px;white-space:nowrap}
.owner svg{width:16px;height:10px}

/* 서랍 · 설정 · 시안 메뉴 */
.sheet{position:absolute;z-index:45;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:9px 10px 10px 12px;display:flex;flex-direction:column;gap:6px}
.sheet h2{margin:0;font-family:var(--f-d);font-weight:400;font-size:18px;color:var(--accent-ink);flex:1}
.xbtn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:2px solid var(--ink);border-radius:999px;background:#fff}
.xbtn svg{width:10px;height:10px}
.log{display:flex;flex-direction:column;gap:6px;max-height:228px;overflow-y:auto;padding-right:2px}
.log .e{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;line-height:1.25}
.log .e img{width:20px;height:20px;flex:none;border-radius:50%;object-fit:cover;border:2px solid var(--pc)}
.log .e span{flex:1;min-width:0}
.log .e b{font-family:var(--f-d);font-weight:400;font-size:14px;color:var(--accent-ink)}
.log .d{display:flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--muted);border-top:2px dashed var(--line);padding-top:5px}
.opt{display:flex;align-items:center;gap:8px;min-height:36px;font-size:13.5px;font-weight:700}
.opt span{flex:1}
.sw{position:relative;width:46px;height:26px;padding:0;border:2.5px solid var(--ink);border-radius:999px;background:#e9e6f7}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:21px}
.seg{display:inline-flex;gap:2px;padding:2px;background:#fff;border:2.5px solid var(--ink);border-radius:999px}
.seg button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.help{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.35;color:var(--muted)}
.help b{font-family:var(--f-d);font-weight:400;color:var(--ink)}
.dlabel{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.wide{width:100%;height:36px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;box-shadow:0 3px 0 var(--ink);font-family:var(--f-d);font-size:15px}
.wide.warn{background:#fff1e0}
.confirm{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:var(--panel2)}
.confirm p{margin:0;font-size:12.5px;font-weight:700;line-height:1.35}
.confirm .r{display:flex;gap:6px}
.confirm .r .pbtn{flex:1;height:32px;font-size:14px}
.demo{position:absolute;z-index:26;display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border:2px dashed var(--ink);border-radius:999px;background:rgba(255,255,255,.8);font-size:12px;font-weight:700}
.demo[aria-expanded="true"]{background:var(--accent2);border-style:solid}

/* 토스트 · 배너 · 회전 안내 */
#toasts{position:absolute;z-index:50;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;cursor:pointer;padding:8px 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;box-shadow:0 4px 0 rgba(43,40,86,.35);white-space:nowrap;animation:tin .25s ease-out}
@keyframes tin{from{translate:0 10px;opacity:0}}
.banner{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;pointer-events:none}
.banner b{font-family:var(--f-d);font-weight:400;font-size:150px;line-height:1;color:var(--accent);-webkit-text-stroke:10px #fff;paint-order:stroke fill;filter:drop-shadow(0 8px 0 var(--ink)) drop-shadow(0 0 30px rgba(255,92,138,.6));animation:bin 1.5s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes bin{0%{scale:.3;opacity:0}18%{scale:1.1;opacity:1}30%{scale:1}82%{opacity:1}100%{opacity:0;scale:1.05}}
.rotate{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:13px}
.rotate svg{width:18px;height:18px;flex:none}

@media (prefers-reduced-motion:reduce){
  .deck.can,.chap.ready,.char.pick,.char.pending,.banner b{animation:none}
  .card{transition:transform .12s,opacity .12s}
}

function handPt(k){const g=GEO[k],w=g.h*.569,hd=CHAR_HAND[g.hand];return{x:g.cx-w/2+w*hd[0],y:g.top+g.h*hd[1]}}
const TABLE={x:200,y:170,w:560,h:280}, DECK={x:405,y:310}, DISC={x:555,y:310}, DROP={x:480,y:310};
const PLANE={cx:480,cy:310,tilt:40,d:900,px:480,py:180};
function PJ(x,y){const t=PLANE.tilt*Math.PI/180,Y=PLANE.cy+(y-PLANE.cy)*Math.cos(t),Z=(y-PLANE.cy)*Math.sin(t),f=PLANE.d/(PLANE.d-Z);return{x:PLANE.px+(x-PLANE.px)*f,y:PLANE.py+(Y-PLANE.py)*f,f}}
function CP(x,y){const q=PJ(x,y);return{x:q.x+L.ox,y:q.y+L.oy,f:q.f}}

function seats(){return S.count===4?["s1","s2","s3"]:S.count===3?["s1","s2"]:["s2"]}

function left(ms){return Math.max(0,Math.ceil((ms-performance.now())/1000))}

// ---- 반응형: 1920×1080 Expand 와 같은 방식 (가운데 묶음은 가운데, 가장자리 UI 는 모서리 · Safe Area) ----
function layout(){
  const g=$("#game"),W=g.clientWidth,H=g.clientHeight,s=Math.min(W/960,H/540);
  const cs=getComputedStyle($("#probe")),inL=parseFloat(cs.paddingLeft)||0,inR=parseFloat(cs.paddingRight)||0,inB=parseFloat(cs.paddingBottom)||0,inT=parseFloat(cs.paddingTop)||0;
  Object.assign(L,{s,W:W/s,H:H/s,gL:16+inL/s,gR:16+inR/s,gT:10+inT/s,gB:10+inB/s});
  L.ox=(L.W-960)/2; L.oy=Math.max(0,(L.H-540)/2);
  const st=$("#stage");st.style.width=L.W+"px";st.style.height=L.H+"px";st.style.transform=`scale(${s})`;
  const c=$("#center");c.style.left=L.ox+"px";c.style.top=L.oy+"px";
  $("#rotate").hidden=W>=H;
  render();
}

    h+=`<div class="sheet" style="right:${L.gR}px;top:${L.gT+48}px;width:236px"><div class="row"><h2>기록</h2><button type="button" id="b-logx" class="xbtn" data-act="log" aria-label="기록 닫기">${ICON.x}</button></div><div class="log">`+
      S.log.map(e=>e.d?`<div class="d">${esc(e.d)}</div>`:`<div class="e"><img src="${avatar(e.who)}" alt="${P[e.who].name}" style="--pc:${P[e.who].col}"><span>${esc(P[e.who].name)} · ${esc(e.t)}</span>${e.v?`<b>${e.v}</b>`:""}</div>`).join("")+`</div></div>`;
  }
  // 설정
  if(S.setOpen){
    h+=`<div class="sheet" style="right:${L.gR}px;top:${L.gT+48}px;width:236px"><div class="row"><h2>설정</h2><button type="button" id="b-setx" class="xbtn" data-act="set" aria-label="설정 닫기">${ICON.x}</button></div>
      <div class="opt"><span id="l-bgm">배경 음악</span><button type="button" id="b-bgm" class="sw" role="switch" aria-labelledby="l-bgm" aria-checked="${S.bgm}" data-act="bgm"></button></div>
      <div class="opt"><span id="l-sfx">효과음</span><button type="button" id="b-sfx" class="sw" role="switch" aria-labelledby="l-sfx" aria-checked="${S.sfx}" data-act="sfx"></button></div>
      ${S.exitAsk?`<div class="confirm"><p>게임에서 나갈까요?</p><div class="r"><button type="button" id="b-exit2" class="pbtn main" data-act="exit-yes">나가기</button><button type="button" id="b-exit3" class="pbtn" data-act="exit-no">계속하기</button></div></div>`
      :`<button type="button" id="b-exit" class="wide warn" data-act="exit">게임 나가기</button>`}</div>`;
  }
  // 시안 조작 (게임 화면에 들어가는 UI 아님)
  if(S.demoOpen){
    h+=`<div class="sheet" style="left:${L.gL}px;top:${L.gT+42}px;width:262px"><div class="row"><h2>시안 조작</h2><button type="button" id="b-demox" class="xbtn" data-act="demo" aria-label="시안 조작 닫기">${ICON.x}</button></div>
      <span class="dlabel">상황</span><div class="seg" role="group" aria-label="상황">${[["my","내 턴"],["opp","상대 턴"],["react","반응 5초"]].map(([v,t])=>`<button type="button" id="d-${v}" data-act="scene" data-v="${v}" aria-pressed="${S.scene===v}">${t}</button>`).join("")}</div>
      <span class="dlabel">인원</span><div class="seg" role="group" aria-label="인원">${[4,3,2].map(v=>`<button type="button" id="d-c${v}" data-act="count" data-v="${v}" aria-pressed="${S.count===v}">${v}명</button>`).join("")}</div>

      <div class="opt"><span id="l-rev">턴 방향 반대</span><button type="button" id="d-rev" class="sw" role="switch" aria-labelledby="l-rev" aria-checked="${S.reversed}" data-act="rev"></button></div>
      <button type="button" id="d-ten" class="wide" data-act="ten">손패 10장으로 (찹츄)</button>
      <button type="button" id="d-reset" class="wide" data-act="reset">처음 상태로</button>
      <span class="dlabel">조작법 · ${MODE==="touch"?"모바일 터치":"PC 마우스"}</span><ul class="help">${HELP[MODE].map(([k,v])=>`<li><b>${k}</b> ${v}</li>`).join("")}</ul></div>`;
  }
  $("#hud").innerHTML=h;
  const t=$("#toasts");t.style.left=L.W/2+"px";t.style.bottom=(L.gB+96)+"px";t.style.top="auto";
  if(f){const e=document.getElementById(f);if(e)e.focus({preventScroll:true})}
  tick();
}

// ---- 카드 ----
function cardInner(name){const d=CARD[name];return`<img class="tpl" src="${A.tpl[d.t]}" alt=""><div class="nm ${name.length>4?"long":""}">${esc(name)}</div><div class="art"><img src="${A.art[d.art]}" alt="${esc(name)}" draggable="false"></div><div class="tx">${esc(d.tx)}</div>`}
function makeCard(name,at){
  const id=++uid,el=document.createElement("div");el.className="card";el.innerHTML=cardInner(name);el.dataset.id=id;
  const c={id,name,el,x:at.x,y:at.y,r:0,sc:at.sc||.6,z:10};cards.set(id,c);place(c,true);$("#cards").appendChild(el);return c;
}
function place(c,instant){
  if(instant){c.el.style.transition="none"}
  c.el.style.transform=`translate(${(c.x-55).toFixed(1)}px,${(c.y-82).toFixed(1)}px) rotate(${c.r.toFixed(2)}deg) scale(${c.sc})`;c.el.style.zIndex=c.z;
  if(instant){c.el.offsetWidth;c.el.style.transition=""}
}
function move(c,x,y,r,sc,z){Object.assign(c,{x,y,r,sc,z:z??c.z});place(c)}
// ---- 손패 배치 (「손패 입력」 시안과 같은 규칙, 1920×1080 값을 이 무대 단위로 ÷2) ----
// 카드 가운데 = 화면 아래 끝 → 절반만 보임. 손패를 만지면 전체가 카드 반 높이만큼 올라온다.
let MODE=matchMedia("(pointer: coarse)").matches?"touch":"mouse";
function geom(){const t=MODE==="touch",cw=t?118:98;return{t,cw,ch:cw*164/110,sc:cw/110}}
function handBox(){const l=L.gL+250+12,r=L.W-L.gR-198-12;return{l,r,cx:(l+r)/2}}
function baseSlots(n){
  const{cw,sc}=geom(),b=handBox(),sp=n>1?Math.min(cw*.8,(b.r-b.l-cw)/(n-1)):0,half=(n-1)/2||1,rs=Math.min(5,32/Math.max(n,1));
  return Array.from({length:n},(_,i)=>{const t=i-(n-1)/2;return{x:b.cx+t*sp,y:L.H+13*(t/half)**2,r:t*rs,sc,z:11+i}});
}
let LAY=[];
function layoutCards(){
  const{t,ch}=geom(),n=S.hand.length,out=baseSlots(n);
  const myTurn=S.turn==="me"&&S.scene!=="react",react=S.react&&S.react.open;
  const raised=S.sel!=null||!!IN.drag||S.revealed||(t&&IN.g&&(IN.g.state==="scrub"||IN.g.state==="zoom"));
  if(raised)out.forEach(p=>{p.y-=ch/2+9});
  S.hand.forEach((id,i)=>{
    const c=cards.get(id),p=out[i];if(!c)return;
    if(id===S.sel){p.y-=ch*.1;p.z=60}
    if(id===S.hover&&id!==S.sel){p.y-=ch*(t?.18:.08);p.z=100}
    const dragging=IN.drag&&IN.drag.id===id;
    if(dragging){p.x=IN.drag.x;p.y=IN.drag.y;p.r=IN.drag.tilt;p.z=200}
    const k=CARD[c.name].t,cl=c.el.classList;cl.add("hand");
    cl.toggle("g-act",myTurn&&k==="A"&&!S.targeting&&!S.busy&&!dragging);
    cl.toggle("g-ctr",!!react&&k==="C"&&S.react.chain.length===1&&!dragging);
    cl.toggle("dim",!!react&&k!=="C");
    cl.toggle("sel",id===S.sel);cl.toggle("hov",id===S.hover);
    cl.toggle("drag",!!dragging);cl.toggle("armed",!!dragging&&IN.drag.armed);
    if(dragging){c.x=p.x;c.y=p.y;c.r=p.r;c.sc=p.sc;c.z=p.z;c.el.style.transform=`translate(${(p.x-55).toFixed(1)}px,${(p.y-82).toFixed(1)}px) rotate(${p.r.toFixed(2)}deg) scale(${p.sc})`;c.el.style.zIndex=p.z}
    else move(c,p.x,p.y,p.r,p.sc,p.z);
  });
  LAY=out;
  const tb=$(".table");if(tb)tb.classList.toggle("hot",!!IN.drag&&IN.drag.armed&&!IN.drag.seat);
  const at=$("#armtag");if(at)at.hidden=!(IN.drag&&IN.drag.armed&&!IN.drag.seat);
}

// ---- 입력 (「손패 입력」 시안) ----
// PC: 올리기 = 손패 올라옴 · 클릭 = 선택 · 더블클릭 = 사용 · 끌어서 테이블/상대 위에 놓기 = 사용 · 우클릭 = 취소
// 모바일: 터치 · 좌우로 훑기 = 올라옴 · 탭 = 선택, 한 번 더 탭 = 사용 · 위로 쓸어 올리기 = 집기 · 길게 누르기 = 크게 보기
const IN={g:null,drag:null,last:{id:null,t:0},raf:0};
const game=$("#game");
function toStage(e){const r=game.getBoundingClientRect();return{x:(e.clientX-r.left)/L.s,y:(e.clientY-r.top)/L.s}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}}
function handLocked(){return S.busy||!!S.targeting||(S.react&&!S.react.open)}
function hitTest(x,y){
  const{cw,ch}=geom();let best=-1,bz=-1;
  LAY.forEach((p,i)=>{
    if(IN.drag&&S.hand[i]===IN.drag.id)return;
    const dx=x-p.x,dy=y-p.y,a=-p.r*Math.PI/180,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
    if(Math.abs(lx)<=cw/2&&Math.abs(ly)<=ch/2&&p.z>bz){bz=p.z;best=i}
  });
  return best;
}
function nearestIdx(x){let b=-1,bd=Infinity;baseSlots(S.hand.length).forEach((p,i)=>{const d=Math.abs(x-p.x);if(d<bd){bd=d;b=i}});return b}
function inHandZone(P){const{cw,ch}=geom(),s=baseSlots(S.hand.length);if(!s.length)return false;return P.y>L.H-ch-25&&P.x>s[0].x-cw*.75&&P.x<s[s.length-1].x+cw*.75}
function playLine(){const{ch}=geom();return L.H-ch-24}
function seatAt(e){
  for(const el of document.elementsFromPoint(e.clientX,e.clientY)){
    const m=el.id&&/^(char|plate)-(s\d)$/.exec(el.id);if(m&&!isDead(m[2]))return m[2];
    const p=el.closest&&el.closest(".plate");if(p&&p.id){const k=p.id.split("-")[1];if(!isDead(k))return k}
  }
  return null;
}
let hotSeat=null;
function markSeat(k){if(hotSeat===k)return;if(hotSeat){const o=$("#char-"+hotSeat);o&&o.classList.remove("hit")}hotSeat=k;if(k){const n=$("#char-"+k);n&&n.classList.add("hit")}}
function lowerHand(){if(S.sel==null&&!S.revealed&&S.hover==null)return;S.sel=null;S.revealed=false;S.hover=null;layoutCards()}

function startDrag(id,P,offX,offY){
  S.revealed=true;S.hover=null;
  IN.drag={id,x:P.x-offX,y:P.y-offY,offX,offY,tilt:0,lastX:P.x,armed:false,seat:null};
  cancelAnimationFrame(IN.raf);
  const tick=()=>{if(!IN.drag)return;IN.drag.tilt*=.86;layoutCards();IN.raf=requestAnimationFrame(tick)};IN.raf=requestAnimationFrame(tick);
  layoutCards();
}
function moveDrag(P,e){
  const d=IN.drag,vx=P.x-d.lastX;d.lastX=P.x;
  d.tilt=Math.max(-18,Math.min(18,d.tilt*.6+vx*.7));
  d.x=P.x-d.offX;d.y=P.y-d.offY;
  const seat=seatAt(e),was=d.armed;
  d.seat=seat;markSeat(seat);
  d.armed=!!seat||P.y<playLine();
  if(d.armed&&!was)buzz(8);
}
function stopDrag(){IN.drag=null;cancelAnimationFrame(IN.raf);markSeat(null)}
function endDrag(){
  const d=IN.drag;if(!d)return;const c=cards.get(d.id),seat=d.seat,armed=d.armed;stopDrag();
  if(armed&&c)useCard(c,seat);else layoutCards();
}

function showZoom(id){
  const c=cards.get(id);if(!c)return;const z=$("#zoom");
  z.innerHTML=`<div class="card" style="transform:translate(${L.W/2-55}px,${L.H/2-82}px) scale(2.3)">${cardInner(c.name)}</div>`;z.hidden=false;
}
function hideZoom(){const z=$("#zoom");z.hidden=true;z.innerHTML=""}

function setMode(m){
  if(m===MODE)return;MODE=m;
  if(IN.g)clearTimeout(IN.g.lp);stopDrag();IN.g=null;hideZoom();S.hover=null;
  layoutCards();if(S.demoOpen)renderHud();
}

function isUI(t){return !!(t.closest&&t.closest("button,.sheet,.pill,.rprompt,.toast,[data-seat]"))}
game.addEventListener("contextmenu",e=>e.preventDefault());
game.addEventListener("pointerdown",e=>{
  setMode(e.pointerType==="mouse"?"mouse":"touch");
  if(isUI(e.target))return;
  const P=toStage(e);
  if(e.button===2){cancelAll();return}
  if(MODE==="mouse"){
    if(e.button!==0)return;
    const i=handLocked()?-1:hitTest(P.x,P.y);
    if(i<0){lowerHand();return}
    const p=LAY[i];
    IN.g={pid:e.pointerId,id:S.hand[i],sx:e.clientX,sy:e.clientY,offX:P.x-p.x,offY:P.y-p.y,moved:false};
    game.setPointerCapture(e.pointerId);return;
  }
  if(IN.g||!S.hand.length||handLocked())return; // 두 번째 손가락 무시
  const{ch}=geom();let i=hitTest(P.x,P.y);
  if(i<0){const lowered=S.sel==null&&!S.revealed;if(!inHandZone(P)||(lowered&&P.y<L.H-ch*.6)){lowerHand();return}i=nearestIdx(P.x)}
  S.hover=S.hand[i];S.revealed=true;
  IN.g={pid:e.pointerId,sx:e.clientX,sy:e.clientY,t0:performance.now(),moved:false,state:"scrub"};
  IN.g.lp=setTimeout(()=>{const g=IN.g;if(g&&g.state==="scrub"&&!g.moved){g.state="zoom";showZoom(S.hover);buzz(15)}},450);
  game.setPointerCapture(e.pointerId);layoutCards();
});
game.addEventListener("pointermove",e=>{
  if(e.pointerType==="mouse"&&MODE!=="mouse"&&!IN.g)setMode("mouse");
  const P=toStage(e),g=IN.g;
  if(MODE==="mouse"){
    if(g&&g.pid===e.pointerId){
      if(!g.moved&&Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>6){g.moved=true;startDrag(g.id,P,g.offX,g.offY)}
      if(IN.drag)moveDrag(P,e);return;
    }
    if(handLocked()||isUI(e.target)){if(S.hover!=null){S.hover=null;layoutCards()}return}
    const i=hitTest(P.x,P.y),id=i>=0?S.hand[i]:null,before=S.revealed;
    if(i>=0)S.revealed=true;else if(S.revealed&&!inHandZone(P))S.revealed=false;
    if(id!==S.hover||before!==S.revealed){S.hover=id;layoutCards()}
    return;
  }
  if(!g||g.pid!==e.pointerId)return;
  if(!g.moved&&Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>10){g.moved=true;clearTimeout(g.lp)}
  if(g.state==="scrub"){
    if((g.sy-e.clientY)/L.s>20&&S.hover!=null){g.state="drag";startDrag(S.hover,P,0,geom().ch*.45);buzz(10)}
    else{const i=nearestIdx(P.x);if(i>=0&&S.hand[i]!==S.hover){S.hover=S.hand[i];buzz(4);layoutCards()}}
  }
  if(g.state==="drag")moveDrag(P,e);
});
function onUp(e){
  const g=IN.g;if(!g||g.pid!==e.pointerId)return;clearTimeout(g.lp);IN.g=null;
  if(MODE==="mouse"){
    if(IN.drag)endDrag();
    else{
      const id=g.id,now=performance.now();
      if(IN.last.id===id&&now-IN.last.t<320){IN.last={id:null,t:0};useCard(cards.get(id),null)}
      else{S.sel=S.sel===id?null:id;IN.last={id,t:now};layoutCards()}
    }
  }else{
    if(g.state==="drag")endDrag();
    else if(g.state==="zoom")hideZoom();
    else if(!g.moved&&performance.now()-g.t0<350&&S.hover!=null){
      const id=S.hover;
      if(S.sel===id){S.hover=null;useCard(cards.get(id),null);return}
      S.sel=id;
    }
    S.hover=null;layoutCards();
  }
}
game.addEventListener("pointerup",onUp);
game.addEventListener("pointercancel",e=>{const g=IN.g;if(!g||g.pid!==e.pointerId)return;clearTimeout(g.lp);hideZoom();stopDrag();IN.g=null;if(MODE!=="mouse")S.hover=null;layoutCards()});
game.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!IN.g&&(S.hover!=null||S.revealed)){S.hover=null;S.revealed=false;layoutCards()}});
addEventListener("blur",()=>{if(!IN.g&&!IN.drag)return;if(IN.g)clearTimeout(IN.g.lp);stopDrag();IN.g=null;hideZoom();layoutCards()});
function cancelAll(){
  if(IN.g)clearTimeout(IN.g.lp);IN.g=null;hideZoom();
  if(S.targeting){cancelTarget();return}
  if(IN.drag){stopDrag();layoutCards();return}
  lowerHand();
}

// 카드 사용 요청 (끌어 놓기 · 더블클릭 · 두 번 탭) — 판정은 없고 화면 흐름만
function useCard(c,seat){
  if(!c)return;const d=CARD[c.name];S.sel=null;S.hover=null;S.revealed=false;
  if(S.react){
    if(S.react.open&&S.react.chain.length===1&&d.t==="C")return addCounter(c);
    toast(S.react.open?"지금은 카운터 카드만 낼 수 있어요.":"체인을 처리하는 중이에요.");layoutCards();return}
  if(S.turn!=="me"){toast("내 턴이 아닙니다.");layoutCards();return}
  if(d.t!=="A"){toast("행동 카드만 낼 수 있습니다.");layoutCards();return}
  if(d.tg&&seat)return play(c,seat);
  if(d.tg)return startTarget(c);
  play(c,null);
}

// ---- 대상 고르기 ----
function startTarget(c){
  S.hand=S.hand.filter(i=>i!==c.id);S.targeting={card:c,end:performance.now()+5000,aim:null};S.sel=null;S.hover=null;S.revealed=false;
  const p=CP(DROP.x,DROP.y);move(c,p.x,p.y,-4,.74,35);c.el.classList.add("g-act");render();
}
function cancelTarget(msg){
  const t=S.targeting;if(!t)return;S.targeting=null;S.hand.push(t.card.id);t.card.el.classList.remove("g-act");if(msg)toast(msg);render();
}

// ---- 카드 내기 연출 (규칙 판정 없음, 화면 흐름만) ----
function play(c,target){
  S.targeting=null;S.busy=true;S.hand=S.hand.filter(i=>i!==c.id);S.sel=null;S.hover=null;S.revealed=false;
  c.el.classList.remove("hand","g-act","sel");render();
  const mid=C(DROP.x,DROP.y-50);move(c,mid.x,mid.y,0,1.3,24);
  const tag=document.createElement("div");tag.className="owner";tag.style.cssText=`left:${mid.x}px;top:${mid.y-82*1.3-30}px`;
  tag.innerHTML=`<span style="color:#0b7ccc">나</span>${target?ICON.arrow+`<span style="color:${P[target].col==="#f2ad18"?"#9a6a00":P[target].col==="#ff6fa5"?"#c2255c":"#8a5527"}">${P[target].name}</span>`:""}`;$("#hud").appendChild(tag);
  setTimeout(()=>{if(target){const el=$("#char-"+target);if(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}}},1100);
  setTimeout(()=>{tag.remove();toDiscard(c);S.log.unshift({who:"me",t:target?`${c.name} → ${P[target].name}`:c.name});S.busy=false;render()},1600);
}
function toDiscard(c){const p=CP(DISC.x,DISC.y);move(c,p.x,p.y,3,.6*p.f,5);setTimeout(()=>{S.discTop=c.name;S.discN++;cards.delete(c.id);c.el.remove();renderCenter()},380)}

// ---- 뽑기 ----
function draw(){
  if(S.busy||S.targeting)return;
  if(S.turn!=="me"||S.scene==="react"){toast("내 턴이 아닙니다.");return}
  if(S.hand.length>=12){toast("시안에서는 12장까지만 뽑아요.");return}
  const name=POOL[S.drawIx++%POOL.length],p=CP(DECK.x,DECK.y),c=makeCard(name,{x:p.x,y:p.y,sc:.6*p.f});
  c.el.classList.add("fly");setTimeout(()=>c.el.classList.remove("fly"),420);
  S.hand.push(c.id);S.deck--;S.chapDone=false;S.log.unshift({who:"me",t:"카드 1장 뽑기"});
  requestAnimationFrame(()=>render());
}

// ---- 반응 5초 ----
function startReact(){
  S.scene="react";S.turn="s1";P.s1.hand=5;
  const hp0=handPt("s1"),from=C(hp0.x,hp0.y-8),c=makeCard("물어뜯기",{x:from.x,y:from.y,sc:.2});
  P.s1.hand=4;S.react={from:"s1",card:c,chain:[{name:"물어뜯기",who:"초코 → 나"}],open:true,end:performance.now()+5000,extra:[]};
  requestAnimationFrame(()=>{const m=C(DROP.x,215);move(c,m.x,m.y,0,1,24);render()});
}
function addCounter(c){
  const r=S.react;S.hand=S.hand.filter(i=>i!==c.id);S.sel=null;S.hover=null;S.revealed=false;
  c.el.classList.remove("hand","g-ctr","sel","dim");
  const m=C(DROP.x+34,228);move(c,m.x,m.y,7,.9,25);
  r.chain.push({name:c.name,who:"나"});r.extra.push(c);r.end=performance.now()+5000;render();
  setTimeout(()=>{if(S.react===r&&r.open)resolveReact(false)},2400);
}
function resolveReact(hitMe){
  const r=S.react;if(!r)return;r.open=false;r.hit=hitMe;
  S.log.unshift({d:"초코 차례"});
  r.chain.forEach(e=>S.log.unshift({who:e.who==="나"?"me":"s1",t:e.who==="나"?e.name:`${e.name} → 나`}));
  render();
  if(hitMe){const el=$("#char-me");el&&el.classList.add("shake")}
  setTimeout(()=>{[...r.extra].reverse().forEach(toDiscard);toDiscard(r.card);
    setTimeout(()=>{S.react=null;S.scene="my";S.turn="me";S.turnEnd=performance.now()+20000;render()},450)},hitMe?900:500);
}

// ---- 버튼 ----
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;t.addEventListener("click",()=>t.remove());$("#toasts").appendChild(t);setTimeout(()=>t.remove(),3000)}
function banner(txt){const b=document.createElement("div");b.className="banner";b.innerHTML=`<b>${esc(txt)}</b>`;$("#stage").appendChild(b);setTimeout(()=>b.remove(),1600)}
function setScene(v){
  resetCards(START_HAND);S.react=null;S.targeting=null;S.busy=false;S.scene=v;S.chapDone=false;
  if(v==="my"){S.turn="me"}
  if(v==="opp"){S.turn=seats().includes("s2")?"s2":seats()[0]}
  S.turnEnd=performance.now()+20000;
  if(v==="react"){if(!seats().includes("s1"))S.count=Math.max(S.count,3);render();startReact();return}
  render();
}
function resetCards(names){for(const c of cards.values())c.el.remove();cards.clear();S.hand=[];
  const n=names.length,leftEdge=L.gL+264,rightEdge=L.W-L.gR-212;
  names.forEach((nm,i)=>{const c=makeCard(nm,{x:leftEdge+(rightEdge-leftEdge)*(i+.5)/n,y:L.H,sc:geom().sc});S.hand.push(c.id)})}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(!b)return; // 빈 곳 · 손패 입력은 pointerdown 에서
  const a=b.dataset.act;
  if(S.targeting&&a==="cancel-bg")return; // 어두운 곳은 무시, 좌석을 탭하거나 취소
  switch(a){
    case "draw":draw();break;
    case "chap":if(S.hand.length===10&&!S.chapDone){S.chapDone=true;P.me.chap=true;banner("찹츄!");S.log.unshift({who:"me",t:"찹츄! 선언"});render()}
      else if(!S.chapDone)toast(`손패가 정확히 10장일 때 외칠 수 있어요. 지금 ${S.hand.length}장`);break;
    case "log":S.logOpen=!S.logOpen;S.setOpen=false;S.demoOpen=false;renderHud();break;
    case "set":S.setOpen=!S.setOpen;S.logOpen=false;S.demoOpen=false;S.exitAsk=false;renderHud();break;
    case "demo":S.demoOpen=!S.demoOpen;S.logOpen=false;S.setOpen=false;renderHud();break;
    case "bgm":S.bgm=!S.bgm;renderHud();break;
    case "sfx":S.sfx=!S.sfx;renderHud();break;
    case "exit":S.exitAsk=true;renderHud();break;
    case "exit-no":S.exitAsk=false;renderHud();break;
    case "exit-yes":S.exitAsk=false;S.setOpen=false;renderHud();toast("시안이라 나가지 않아요. 실제로는 룸 화면으로 돌아가요.");break;
    case "cancel":cancelTarget();break;
    case "pass":resolveReact(true);break;
    case "scene":setScene(b.dataset.v);break;
    case "count":S.count=+b.dataset.v;if(!seats().includes(S.turn)&&S.turn!=="me")S.turn=seats()[0];if(S.react){S.react=null;setScene("my")}else render();break;
    case "deaths":S.deaths=!S.deaths;render();break;
    case "rev":S.reversed=!S.reversed;renderHud();break;
    case "ten":{const names=[];for(let i=0;i<10;i++)names.push(POOL[i]);S.drawIx=0;S.react=null;S.targeting=null;S.scene="my";S.turn="me";S.chapDone=false;resetCards(names);render();break}
    case "reset":Object.assign(S,{count:4,deaths:false,reversed:false,deck:34,discN:12,discTop:"짖기",drawIx:0});P.me.chap=false;setScene("my");break;
  }
});
// 대상 고르기: 좌석 탭 · 호버
document.addEventListener("pointerup",e=>{
  if(!S.targeting)return;const s=e.target.closest&&e.target.closest("[data-seat]");if(s&&s.dataset.seat)play(S.targeting.card,s.dataset.seat);
});
document.addEventListener("pointerover",e=>{
  if(!S.targeting)return;const s=e.target.closest&&e.target.closest("[data-seat]"),k=s&&s.dataset.seat||null;
  if(k!==S.targeting.aim){S.targeting.aim=k;renderCenter()}
});
document.addEventListener("contextmenu",e=>{if(S.targeting){e.preventDefault();cancelTarget()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.targeting)cancelTarget();else if(S.logOpen||S.setOpen||S.demoOpen){S.logOpen=S.setOpen=S.demoOpen=false;renderHud()}}});

// ---- 시간 표시 ----
function tick(){
  const now=performance.now();
  if(S.turnEnd<now)S.turnEnd=now+20000; // 시안: 0초가 되면 다시 20초
  const tl=left(S.turnEnd);
  document.querySelectorAll("[data-turntimer]").forEach(el=>{el.lastChild.textContent=tl;el.classList.toggle("low",tl<=5)});
  const mt=$("[data-metimer]");if(mt){mt.textContent=tl;mt.classList.toggle("low",tl<=5)}
  const pd=$("[data-pend]");if(pd)pd.textContent=1+Math.floor((now/1000)%5);
  if(S.targeting){const r=left(S.targeting.end),e=$("[data-tcount]");if(e)e.textContent=r+"초";if(r<=0)cancelTarget("시간이 지나 카드를 손패로 되돌렸어요.")}
  if(S.react&&S.react.open){const ms=Math.max(0,S.react.end-now),b=$("[data-rbar]"),c=$("[data-rcount]");if(b)b.style.width=(ms/50)+"%";if(c)c.textContent=Math.ceil(ms/1000)+"초";
    if(ms<=0)resolveReact(S.react.chain.length===1)}
}
setInterval(tick,100);

// ---- 시작 ----
new ResizeObserver(()=>layout()).observe($("#game"));
layout();
S.turnEnd=performance.now()+20000;
resetCards(START_HAND);render();
</script>
